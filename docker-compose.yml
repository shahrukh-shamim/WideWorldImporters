networks:
  wwi:
    driver: bridge
    
services:
  wwi-db:
    container_name: wwi-db-sqlserver2022
    build:
      context: .
      dockerfile: ./docker/wwi-db/Dockerfile
    networks:
      - wwi
    ports:
      - "1533:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    profiles:  ["db", "backend", "dev"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StrongPassword@"
    volumes:
      - wwi-db-data:/var/opt/mssql
  wwi-api:
    container_name: wwi-api
    build:
      context: .
      dockerfile: ./docker/wwi-api/Dockerfile
    networks:
      - wwi
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=5000
    profiles:  ["api", "backend", "dev"]
    env_file:
      - ./docker/.env
    ports:
      - "5000:5000"
    volumes:
      - ~/.aspnet/https:/https:ro
      - ${HOME:-/root}/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro
  wwi-app:
    container_name: wwi-app
    build:
      context: .
      dockerfile: ./docker/wwi-app/Dockerfile
    networks:
      - wwi
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=5001
    profiles:  ["app", "dev"]
    env_file:
      - ./docker/.env
    ports:
      - "5001:5001"
    volumes:
      - ~/.aspnet/https:/https:ro
      - ${HOME:-/root}/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro

volumes:
  wwi-db-data:
    driver: local
